<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro</title>
<link rel="stylesheet" href="styles/registro.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card p-4">
    <h3>Registrar Usuario</h3>
    <input id="nombre" class="form-control mb-2" placeholder="Nombre">
    <input id="correo" class="form-control mb-2" placeholder="Correo">
    <input id="password" type="password" class="form-control mb-2" placeholder="Contraseña">
    <select id="rol" class="form-control mb-3">
      <option value="usuario">Usuario</option>
      <option value="admin">Administrador</option>
    </select>
    <button onclick="registrar()" class="btn btn-success">Registrarme</button>
    <a href="index.html" class="btn-volver">Volver</a>
    
    
  </div>
</div>

<script>
async function registrar(){
  const nombre = nombreInput = document.getElementById('nombre').value;
  const correo = document.getElementById('correo').value;
  const password = document.getElementById('password').value;
  const rol = document.getElementById('rol').value;

  const r = await fetch('/api/usuarios/registro',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({nombre,correo,password,rol})
  });

  const data = await r.json();
  if(r.ok){
    alert('Usuario registrado');
    location.href='login.html';
  }else alert(data.error);
}
</script>
</body>
</html>
